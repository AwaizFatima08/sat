include: package:very_good_analysis/analysis_options.yaml

analyzer:
  language:
    strict-casts: true
    strict-raw-types: true
  exclude:
    - build/**

linter:
  rules:
    # App code, not a published package: docs on the public surface are kept to where they add value.
    public_member_api_docs: false
    lines_longer_than_80_chars: false
